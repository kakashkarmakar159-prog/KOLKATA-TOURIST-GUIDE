<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chat | Kolkata Tourist Guide</title>
  <style>
:root{color-scheme:dark;--bg:#0b0b12;--panel:#151520;--panel2:#1b1b29;--line:#2b2b3c;--text:#f7f5ff;--muted:#a6a3b7;--purple:#8651f5;--purple2:#6333d2;--green:#32d583;--bubble:#202031;--mine:#39245f;--shadow:0 18px 55px rgba(0,0,0,.28)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100%;font-family:Inter,Arial,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--text)}
body{overflow:hidden}button,input{font:inherit}button{cursor:pointer}
.chat-app{height:100dvh;width:100%;padding:0;display:flex;justify-content:center;background:radial-gradient(ellipse at 50% -20%,#292044 0,transparent 55%),var(--bg)}
.chat-shell{width:min(100%,900px);height:100dvh;min-height:0;background:var(--panel);border-left:1px solid rgba(255,255,255,.06);border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;overflow:hidden;position:relative}
.chat-titlebar{min-height:82px;padding:13px 18px;display:flex;align-items:center;gap:13px;background:rgba(22,22,34,.97);border-bottom:1px solid var(--line);z-index:3}
.plain-icon{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);color:var(--text);font-size:24px;display:grid;place-items:center;flex:0 0 auto}
.title-copy{min-width:0;flex:1}.brand-title{font-size:16px;font-weight:800;letter-spacing:-.2px}.name-caption{font-size:11px;color:var(--muted);margin-top:4px}.chat-titlebar h1{font-size:20px;line-height:1.2;margin:5px 0 0;font-weight:800;letter-spacing:-.4px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:capitalize}
.header-status{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);white-space:nowrap;padding:8px 10px;border:1px solid var(--line);border-radius:20px;background:var(--panel2)}
.header-status i{width:7px;height:7px;border-radius:50%;background:#e3a63b}.header-status.connected i{background:var(--green);box-shadow:0 0 0 4px #32d58320}
.participant-bar{min-height:76px;background:#12121c;display:flex;align-items:center;border-bottom:1px solid var(--line);padding:10px 14px;gap:10px;z-index:2}
.participant-scroll{min-width:0;flex:1;overflow:hidden}.members{display:flex;align-items:center;gap:10px;overflow-x:auto;scrollbar-width:none}.members::-webkit-scrollbar{display:none}
.member{display:flex;align-items:center;gap:8px;min-width:max-content;padding:5px 11px 5px 5px;border:1px solid var(--line);border-radius:28px;background:var(--panel2);color:var(--text)}
.member-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(145deg,#9b70ff,#6035c5);flex:0 0 38px;overflow:hidden}
.member-info{display:flex;flex-direction:column;gap:3px}.member-name{font-weight:700;font-size:12px}.member-status{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:5px}.online-dot{width:7px;height:7px;background:var(--green);border-radius:50%;display:inline-block}
.participant-actions{display:flex;gap:7px;flex:0 0 auto}.action-icon{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);color:var(--text);font-size:21px;display:grid;place-items:center}.action-icon:active,.plain-icon:active{transform:scale(.96)}.location-action{color:#c7b3ff}
.messages{flex:1;min-height:0;overflow-y:auto;padding:18px clamp(12px,3vw,28px) 22px;background:linear-gradient(180deg,#10101a,#0e0e17);scroll-behavior:smooth;overscroll-behavior:contain}
.today-pill{width:max-content;margin:0 auto 22px;padding:6px 13px;border:1px solid var(--line);border-radius:20px;background:#191925;color:#9692a9;font-size:10px}
.message-row{display:flex;align-items:flex-end;gap:9px;margin:0 0 15px;animation:pop .16s ease-out}.message-row.mine{justify-content:flex-end}
@keyframes pop{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}
.avatar{width:34px;height:34px;border-radius:50%;background:#3c2b60;color:#eee5ff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:0 0 34px;margin-bottom:2px;overflow:hidden}
.bubble{max-width:min(78%,620px);background:var(--bubble);border:1px solid #303044;border-radius:18px 18px 18px 5px;padding:10px 13px 8px;box-shadow:0 4px 14px #0002;line-height:1.45;color:var(--text)}
.mine .bubble{background:linear-gradient(145deg,#432b70,#34214f);border-color:#67489a;border-radius:18px 18px 5px 18px}
.bubble strong{display:block;font-size:11px;color:#c4a9ff;margin-bottom:4px}.mine .bubble strong{color:#e0d0ff}.bubble-text{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.meta{float:right;margin:7px 0 0 12px;color:#a9a4ba;font-size:9px}
.quoted{border-left:3px solid #a16be8;background:#a16be81a;padding:6px 9px;margin-bottom:7px;border-radius:5px}.quoted b{font-size:10px;color:#d0baff}.quoted div{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-btn{display:block;border:0;background:transparent;color:#aaa2bd;font-size:10px;padding:5px 0 0}.reply-btn:hover{color:#d2baff}
.system{color:#c8bd9c;text-align:center;font-size:10px;margin:13px auto;background:#302b21;padding:7px 12px;border-radius:12px;width:max-content;max-width:92%;border:1px solid #554a31}
.typing{font-size:11px;color:#b8aecb;padding:0 5px 10px;min-height:22px}.typing-dots:after{content:"";display:inline-block;width:18px;animation:dots 1.2s steps(4,end) infinite}@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}
.reply-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 15px;background:#1b1927;border-top:1px solid var(--line);border-left:3px solid var(--purple)}.reply-copy{min-width:0}.reply-copy span{font-size:10px;color:var(--muted)}.reply-copy strong{display:block;color:#c8adff;font-size:11px}.reply-copy p{margin:2px 0 0;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reply-bar button{border:0;background:transparent;color:var(--muted);font-size:23px}
.composer{background:#151520;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.composer-inner{display:flex;align-items:center;gap:9px;border:1px solid #343348;background:#20202e;border-radius:18px;padding:5px 6px 5px 15px;box-shadow:0 4px 15px #0002}
.composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:14px;padding:11px 0}.composer input::placeholder{color:#89869c}
.send-btn{width:44px;height:44px;border:0;border-radius:14px;background:linear-gradient(145deg,#9460ff,#6532cf);color:#fff;font-size:22px;display:grid;place-items:center;box-shadow:0 5px 15px #6733c94d}.send-btn:disabled{opacity:.45;cursor:not-allowed}
.track-drawer{position:fixed;inset:0;background:#07070dc9;backdrop-filter:blur(7px);z-index:80;display:none}.track-drawer.open{display:block}.track-panel{position:absolute;right:0;top:0;height:100%;width:min(650px,100vw);background:var(--panel);display:flex;flex-direction:column;box-shadow:-20px 0 55px #0008}
.track-head{padding:18px;display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line)}.track-head h2{margin:4px 0;font-size:22px}.track-head p{margin:0;color:var(--muted);font-size:12px}.track-kicker{font-size:10px;letter-spacing:1.5px;color:#bba0ff;font-weight:800}.close-track{width:40px;height:40px;border:0;border-radius:13px;background:var(--panel-soft);color:var(--text);font-size:24px}
.live-map{flex:1;min-height:300px;background:#e9eee9}.location-legend{padding:13px 16px;max-height:180px;overflow:auto;border-top:1px solid var(--line);color:var(--text);font-size:11px}.legend-title{font-weight:800;margin-bottom:7px}.location-legend>div{padding:5px 0;display:flex;gap:8px;align-items:center}.location-legend b{min-width:55px}.location-legend span:last-child{color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;flex:0 0 8px}.dot.me{background:var(--purple)}.location-member{display:flex;gap:8px;align-items:center;padding:5px 0}
@media(min-width:900px){.chat-shell{border-radius:18px;height:calc(100dvh - 24px);margin:12px 0;box-shadow:var(--shadow)}}
@media(max-width:650px){.chat-shell{height:100dvh;border:0}.chat-titlebar{min-height:74px;padding:10px 12px}.brand-title{font-size:14px}.name-caption{font-size:10px;margin-top:3px}.chat-titlebar h1{font-size:18px}.header-status{font-size:0;padding:9px}.header-status i{width:8px;height:8px}.participant-bar{min-height:67px;padding:8px}.member{gap:6px;padding:4px 8px 4px 4px}.member-avatar{width:34px;height:34px;flex-basis:34px}.member-name{font-size:11px}.member-status{font-size:9px}.action-icon{width:38px;height:38px}.messages{padding:13px 10px 16px}.bubble{max-width:84%;padding:9px 11px 7px}.bubble-text{font-size:13px}.avatar{width:30px;height:30px;flex-basis:30px}.composer{padding:8px 9px calc(8px + env(safe-area-inset-bottom))}.send-btn{width:42px;height:42px}.track-panel{width:100%}}
</style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
</head>
<body>
  <main class="chat-app">
    <section class="chat-shell" aria-label="Kolkata Tourist Guide group chat">
      <header class="chat-titlebar">
        <button id="backBtn" class="plain-icon" type="button" aria-label="Back">←</button>
        <div class="title-copy">
          <div class="brand-title">Kolkata Tourist Guide</div>
          <div class="name-caption" id="nameCaption">Profile identity</div>
          <h1 id="groupTitle">Place Group Chat</h1>
        </div>
        <div id="connectionStatus" class="header-status"><i></i><span>Connecting</span></div>
      </header>

      <section class="participant-bar" aria-label="Chat participants">
        <div class="participant-scroll">
          <div id="members" class="members"></div>
        </div>
        <div class="participant-actions">
          <button id="trackBtn" class="action-icon location-action" type="button" aria-label="Track live locations" title="Track live locations">⌖</button>
          <button id="themeBtn" class="action-icon" type="button" aria-label="Toggle theme" title="Toggle theme">☾</button>
        </div>
      </section>

      <section id="messages" class="messages" aria-live="polite" aria-label="Messages">
        <div class="today-pill">Today</div>
      </section>

      <div id="replyBar" class="reply-bar" hidden>
        <div class="reply-copy"><span>↩ Replying to</span><strong id="replyName"></strong><p id="replyText"></p></div>
        <button id="cancelReply" type="button" aria-label="Cancel reply">×</button>
      </div>

      <div id="typingIndicator" class="typing" aria-live="polite"></div>
      <form id="messageForm" class="composer" autocomplete="off">
        <div class="composer-inner">
          <input id="messageInput" placeholder="Write a message…" maxlength="1000" autocomplete="off" aria-label="Message">
          <button id="sendBtn" class="send-btn" type="submit" aria-label="Send message" title="Send">➤</button>
        </div>
      </form>
    </section>
  </main>

  <div id="trackDrawer" class="track-drawer" aria-hidden="true">
    <div class="track-panel">
      <header class="track-head">
        <div>
          <div class="track-kicker">GROUP TRACKING</div>
          <h2>Live Location</h2>
          <p id="trackStatus">Waiting for location…</p>
        </div>
        <button id="closeTrack" class="close-track" type="button" aria-label="Close live location">×</button>
      </header>
      <div id="liveMap" class="live-map"></div>
      <div class="location-legend">
        <div class="legend-title">People sharing location</div>
        <div class="my-location-row"><span class="dot me"></span><b>You</b><span id="myLocationText">Location not shared</span></div>
        <div id="otherLocationRows"></div>
      </div>
    </div>
  </div>
  <script src="github-pages.js"></script>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="profile.js"></script>
  <script src="chat-config.js"></script>
  <script src="chat.js"></script>
</body>
</html>
